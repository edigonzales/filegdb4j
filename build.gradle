allprojects {
    group = 'ch.so.agi'
    version = '0.1.0-SNAPSHOT'
}

def runtimeModuleNames = [
        'filegdb4j-geometry',
        'filegdb4j-core',
        'filegdb4j-jts'
]

def mavenUsername = providers.gradleProperty('MAVEN_USERNAME')
        .orElse(providers.environmentVariable('MAVEN_USERNAME'))
def mavenPassword = providers.gradleProperty('MAVEN_PASSWORD')
        .orElse(providers.environmentVariable('MAVEN_PASSWORD'))

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.12.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.assertj:assertj-core:3.27.3'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(providers.gradleProperty('testJavaVersion').getOrElse('21'))
        }
        useJUnitPlatform()
        systemProperty 'filegdb.test.data',
                rootProject.layout.projectDirectory.dir('test-data').asFile.absolutePath
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }

        if (runtimeModuleNames.contains(project.name)) {
            repositories {
                maven {
                    name = 'interlisGuruSnapshots'
                    url = uri('https://jars.interlis.guru/snapshots/')
                    credentials {
                        username = mavenUsername.orNull
                        password = mavenPassword.orNull
                    }
                    mavenContent {
                        snapshotsOnly()
                    }
                }
            }
        }
    }
}

tasks.register('verifySnapshotPublication') {
    group = 'publishing'
    description = 'Verifies the version and module set used for snapshot publication.'

    doLast {
        def rootVersion = project.version.toString()
        if (!rootVersion.endsWith('-SNAPSHOT')) {
            throw new GradleException("Snapshot publication requires a -SNAPSHOT version, got ${rootVersion}")
        }

        runtimeModuleNames.each { moduleName ->
            def module = project(":${moduleName}")
            if (module.version.toString() != rootVersion) {
                throw new GradleException("${moduleName} has version ${module.version}, expected ${rootVersion}")
            }
        }
    }
}

tasks.register('publishSnapshots') {
    group = 'publishing'
    description = 'Publishes the three runtime modules to the interlis.guru snapshot repository.'
    dependsOn 'verifySnapshotPublication'
    dependsOn runtimeModuleNames.collect { moduleName ->
        ":${moduleName}:publishMavenJavaPublicationToInterlisGuruSnapshotsRepository"
    }
}
